
services:
  app:
    build:
      context: .
      target: app
    env_file:
      - .env.container
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: laravel_request_container_db
      DB_USERNAME: laravel_app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel_network
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - app
    networks:
      - laravel_network
    restart: unless-stopped

  db:
    image: mysql:8.4
    env_file:
      - .env.container
    environment:
      MYSQL_DATABASE: laravel_request_container_db
      MYSQL_USER: laravel_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laravel_network
    restart: unless-stopped

networks:
  laravel_network:
    driver: bridge

volumes:
  db_data:
